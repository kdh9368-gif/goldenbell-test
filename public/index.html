<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>독심술사의 눈치고사</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#294766,#07111f 48%,#02070d);color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:680px;margin:auto;padding:22px 16px}.logo{text-align:center;padding:18px 0}.logo small{color:#f4c95d;font-weight:900;letter-spacing:4px}.logo h1{font:900 clamp(40px,10vw,72px) Georgia,serif;color:#fff0a6;margin:5px 0;text-shadow:0 4px 30px #000}.logo p,.muted{color:#9fb0c3}.card{background:#0a1725ef;border:1px solid #38516b;border-radius:22px;padding:22px;box-shadow:0 18px 60px #0008}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.stat{background:#07121e;border-radius:14px;padding:12px;text-align:center}.stat b{font-size:27px;color:#fff0a6;display:block}.stat span{font-size:12px;color:#9fb0c3}.qnum{color:#f4c95d;font-weight:900}.q{font-size:clamp(23px,6vw,34px);font-weight:900;line-height:1.4;margin:9px 0 20px}.choices{display:grid;gap:11px}.choice{width:100%;padding:17px;border:1px solid #35516c;background:#10253a;border-radius:15px;color:#fff;text-align:left;font-size:17px;cursor:pointer}.choice.sel{border:2px solid #f4c95d;background:#253b4c}.choice:disabled{opacity:.7}.btn{width:100%;padding:16px;border:0;border-radius:14px;background:#e2b33f;color:#101820;font-weight:900;font-size:18px;margin-top:14px;cursor:pointer}input{width:100%;padding:16px;border-radius:13px;border:1px solid #35516c;background:#07121e;color:#fff;font-size:17px}.center{text-align:center}.resultbox{margin-top:20px;padding:18px;border:1px solid #38516b;border-radius:16px;background:#07121e}.resulttitle{font-size:28px;font-weight:900;margin:0 0 8px}.survive{color:#fff0a6}.out{color:#ff9d9d}.mine{margin:12px 0;font-weight:800}.vote{display:grid;grid-template-columns:28px 1fr 48px;gap:8px;align-items:center;margin:9px 0}.bar{height:12px;background:#16283a;border-radius:99px;overflow:hidden}.fill{height:100%;background:#e2b33f}.crown{color:#fff0a6;font-weight:900}.center{text-align:center}.questionimg{width:100%;display:block;border-radius:16px;margin:4px 0 16px;border:1px solid #38516b}.rule{background:#122a40;border:1px solid #42607c;border-radius:12px;padding:12px 14px;margin:0 0 16px;font-weight:800;color:#fff0a6}.timer{font-size:34px;font-weight:900;text-align:center;margin:0 0 14px;color:#fff0a6}.timer.danger{color:#ff9d9d}</style><main class=wrap><header class=logo><small>MEDICAL SCHOOL SPECIAL</small><h1>독심술사의 눈치고사</h1><p>가장 많은 사람이 고른 답이 정답!</p></header><section class=card id=app></section></main><script>
let ws,joined=false,s=null,selected=null,submitted=false,app=document.querySelector('#app'),timerTick=null;
let token=localStorage.getItem('goldenbellToken');
if(!token){token=(crypto.randomUUID?crypto.randomUUID():(Date.now()+'-'+Math.random().toString(36).slice(2)));localStorage.setItem('goldenbellToken',token)}
function send(type,o={}){ws&&ws.readyState===1&&ws.send(JSON.stringify({type,...o}))}
function connect(){
  ws=new WebSocket(location.origin.replace(/^http/,'ws'));
  ws.onopen=()=>{if(token)send('resume',{token})};
  ws.onmessage=e=>{
    let m=JSON.parse(e.data);
    if(m.type==='error')alert(m.message);
    if(m.type==='resume_failed'){joined=false;render()}
    if(m.type==='joined'){joined=true;render()}
    if(m.type==='submitted'){submitted=true}
    if(m.type==='state'){let oldRound=s?.round;s=m.state;if(oldRound!==undefined&&oldRound!==s.round){selected=null;submitted=false}if(s.myAnswer!==null)submitted=true;render()}
  };
  ws.onclose=()=>{setTimeout(connect,1000)}
}
function timeLeft(){return !s?.deadline?null:Math.max(0,Math.ceil((s.deadline-Date.now())/1000))}
function timerHTML(){let t=timeLeft();return t===null?'':'<div class="timer '+(t<=5?'danger':'')+'">⏱ '+t+'초</div>'}
function render(){
  if(!joined){app.innerHTML='<h2>참가자 입장</h2><p class=muted>이름 또는 학번을 입력하세요. (예: 2026XXXXX)</p><input id=name placeholder="이름 / 학번 (예: 2026XXXXX)"><button class=btn onclick="join()">입장하기</button>';return}
  if(!s)return;
  if(s.phase==='lobby'){app.innerHTML='<div class=center><h2>입장 완료</h2><p class=muted>진행자가 게임을 시작할 때까지 기다려주세요.</p></div>';return}
  if(s.phase==='finished'){app.innerHTML='<div class=center><h2>🏆 눈치고사 종료</h2><p>게임이 종료되었습니다.</p></div>';return}
  if(s.phase==='question'&&s.myAlive===false){app.innerHTML='<div class=center><div style="font-size:54px;margin:10px 0">💀</div><h2>탈락하셨습니다</h2><p class=muted>아쉽지만 이번 눈치고사에서는 탈락했습니다.<br>남은 참가자들의 결과를 지켜봐 주세요!</p><div class=stats style="margin-top:22px"><div class=stat><b>'+s.roundLabel+'</b><span>현재 ROUND</span></div><div class=stat><b>'+s.alive+'</b><span>생존자</span></div></div></div>';return}
  let label=i=>String.fromCharCode(65+i);app.innerHTML='<div class=stats><div class=stat><b>'+s.roundLabel+'</b><span>'+(s.isExample?'EXAMPLE':'ROUND')+'</span></div><div class=stat><b>'+s.alive+'</b><span>생존자</span></div></div><div class=qnum>'+(s.isExample?'예시문제':('QUESTION '+s.roundLabel))+' · '+s.choiceCount+'지선다</div><div class=q>'+s.question+'</div>'+(s.image?'<img class=questionimg src="'+s.image+'" alt="선택지 사진">':'')+'<div class=rule>'+s.ruleText+'</div>'+timerHTML()+'<div class=choices>'+s.choices.map((x,i)=>'<button class="choice '+((selected===i||s.myAnswer===i)?'sel':'')+'" '+(s.phase!=='question'||submitted||timeLeft()===0?'disabled':'')+' onclick="pick('+i+')"><b>'+label(i)+'</b>　'+x+'</button>').join('')+'</div>'+(s.phase==='question'?(submitted?'<div class=center style="margin-top:20px"><h2>✓ 제출 완료</h2><p class=muted>결과 공개를 기다려주세요.</p></div>':'<button class=btn onclick=submit()>답안 제출</button>'):resultView())
}
function resultView(){let r=s.result;if(!r)return '<div class=center style="margin-top:20px"><h2>🔔 결과 공개</h2></div>';let label=i=>String.fromCharCode(65+i),wins=r.winners.map(i=>label(i)).join(' · '),mine=s.myAnswer===null?'미제출':label(s.myAnswer),max=Math.max(...r.counts,1),bars=r.counts.map((n,i)=>'<div class=vote><b class="'+(r.winners.includes(i)?'crown':'')+'">'+label(i)+(r.winners.includes(i)?'👑':'')+'</b><div class=bar><div class=fill style="width:'+((n/max)*100)+'%"></div></div><span>'+n+'명</span></div>').join('');if(s.isExample)return '<div class=resultbox><div class="resulttitle survive">📊 예시문제 결과</div><div><b>더 많이 고른 답: '+wins+'</b></div><div class=mine>내가 고른 답: '+mine+'</div><div style="margin:16px 0 8px;font-weight:900">전체 투표 결과</div>'+bars+'<p class=muted style="margin-bottom:0">예시문제는 어떤 답을 골라도 탈락하지 않습니다.</p></div>';let ok=s.myAlive===true;return '<div class=resultbox><div class="resulttitle '+(ok?'survive':'out')+'">'+(ok?'🎉 생존!':'💀 탈락!')+'</div><div><b>'+(s.isLeast?'이번 라운드 최소 득표 생존 답변: ':'이번 라운드 생존 답변: ')+wins+'</b></div><div class=mine>내가 고른 답: '+mine+'</div><div style="margin:16px 0 8px;font-weight:900">전체 투표 결과</div>'+bars+'<p class=muted style="margin-bottom:0">현재 생존자 '+s.alive+'명</p></div>'}
function join(){let n=document.querySelector('#name').value.trim();if(n)send('join',{name:n,token});else alert('이름 또는 학번을 입력해주세요.')}
function pick(i){if(!submitted){selected=i;render()}}
function submit(){if(timeLeft()===0)return alert('제출 시간이 종료되었습니다.');if(selected===null)return alert('답을 선택해주세요.');if(!ws||ws.readyState!==1)return alert('연결을 복구하는 중입니다. 잠시 후 다시 눌러주세요.');send('submit',{answer:selected})}
connect();setInterval(()=>{if(joined&&s?.phase==='question')render()},250);
</script></html>
