<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도전! 의대 골든벨</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#294766,#07111f 48%,#02070d);color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:680px;margin:auto;padding:22px 16px}.logo{text-align:center;padding:18px 0}.logo small{color:#f4c95d;font-weight:900;letter-spacing:4px}.logo h1{font:900 clamp(40px,10vw,72px) Georgia,serif;color:#fff0a6;margin:5px 0;text-shadow:0 4px 30px #000}.logo p,.muted{color:#9fb0c3}.card{background:#0a1725ef;border:1px solid #38516b;border-radius:22px;padding:22px;box-shadow:0 18px 60px #0008}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.stat{background:#07121e;border-radius:14px;padding:12px;text-align:center}.stat b{font-size:27px;color:#fff0a6;display:block}.stat span{font-size:12px;color:#9fb0c3}.qnum{color:#f4c95d;font-weight:900}.q{font-size:clamp(23px,6vw,34px);font-weight:900;line-height:1.4;margin:9px 0 20px}.choices{display:grid;gap:11px}.choice{width:100%;padding:17px;border:1px solid #35516c;background:#10253a;border-radius:15px;color:#fff;text-align:left;font-size:17px;cursor:pointer}.choice.sel{border:2px solid #f4c95d;background:#253b4c}.choice:disabled{opacity:.7}.btn{width:100%;padding:16px;border:0;border-radius:14px;background:#e2b33f;color:#101820;font-weight:900;font-size:18px;margin-top:14px;cursor:pointer}input{width:100%;padding:16px;border-radius:13px;border:1px solid #35516c;background:#07121e;color:#fff;font-size:17px}.center{text-align:center}</style><main class=wrap><header class=logo><small>MEDICAL SCHOOL SPECIAL</small><h1>도전! 의대 골든벨</h1><p>가장 많은 사람이 고른 답이 정답!</p></header><section class=card id=app></section></main><script>let ws,joined=false,s=null,selected=null,app=document.querySelector('#app');function send(type,o={}){ws&&ws.readyState===1&&ws.send(JSON.stringify({type,...o}))}function connect(){ws=new WebSocket(location.origin.replace(/^http/,'ws'));ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='error')alert(m.message);if(m.type==='joined')joined=true;if(m.type==='state'){s=m.state;render()}};ws.onclose=()=>setTimeout(connect,1500)}function render(){if(!joined){app.innerHTML='<h2>참가자 입장</h2><p class=muted>이름 또는 참가번호를 입력하세요.</p><input id=name placeholder="이름 / 참가번호"><button class=btn onclick="join()">입장하기</button>';return}if(!s)return;if(s.phase==='lobby'){app.innerHTML='<div class=center><h2>입장 완료</h2><p class=muted>진행자가 게임을 시작할 때까지 기다려주세요.</p></div>';return}if(s.phase==='finished'){app.innerHTML='<div class=center><h2>🏆 골든벨 종료</h2><p>게임이 종료되었습니다.</p></div>';return}app.innerHTML='<div class=stats><div class=stat><b>'+(s.round+1)+'</b><span>ROUND</span></div><div class=stat><b>'+s.alive+'</b><span>생존자</span></div></div><div class=qnum>QUESTION '+(s.round+1)+'</div><div class=q>'+s.question+'</div><div class=choices>'+s.choices.map((x,i)=>'<button class="choice '+(selected===i?'sel':'')+'" '+(s.phase!=='question'?'disabled':'')+' onclick="pick('+i+')"><b>'+"ABCD"[i]+'</b>　'+x+'</button>').join('')+'</div>'+(s.phase==='question'?'<button class=btn onclick=submit()>답안 제출</button>':'<div class=center style="margin-top:20px"><h2>🔔 결과 공개</h2><p class=muted>생존자 '+s.alive+'명</p></div>')}function join(){let n=document.querySelector('#name').value.trim();if(n)send('join',{name:n});else alert('이름 또는 참가번호를 입력해주세요.')}function pick(i){selected=i;render()}function submit(){if(selected===null)return alert('답을 선택해주세요.');send('submit',{answer:selected});selected=null}connect();</script></html>
