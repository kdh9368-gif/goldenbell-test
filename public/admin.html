<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>골든벨 진행자</title><style>*{box-sizing:border-box}body{margin:0;background:#050c14;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#0b1826;border:1px solid #2e4962;border-radius:18px;padding:22px;margin-top:18px}.gold{color:#f4c95d}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#07111c;padding:15px;text-align:center;border-radius:13px}.stat b{display:block;font-size:30px;color:#fff0a6}.stat span{color:#9fb0c3;font-size:12px}.q{font-size:34px;font-weight:900;line-height:1.35;margin:15px 0}.btn{padding:14px 18px;border:1px solid #42607c;background:#122a40;color:#fff;border-radius:12px;font-weight:900;cursor:pointer}.primary{background:#e1b13e;color:#111;border:0}.danger{background:#451d29}.buttons{display:flex;gap:9px;flex-wrap:wrap}.bars{display:grid;gap:12px;margin-top:18px}.row{display:grid;grid-template-columns:30px 1fr 60px;gap:10px;align-items:center}.track{height:18px;background:#162b40;border-radius:20px;overflow:hidden}.fill{height:100%;background:#f4c95d}.input{width:100%;padding:15px;background:#07111c;border:1px solid #36516b;border-radius:12px;color:#fff;font-size:16px;margin:10px 0}.login{max-width:450px;margin:12vh auto}.hint{color:#9fb0c3}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.q{font-size:25px}}</style><main class=wrap id=root></main><script>let ws,s=null,root=document.querySelector('#root');function send(type,o={}){ws&&ws.readyState===1&&ws.send(JSON.stringify({type,...o}))}function connect(){ws=new WebSocket(location.origin.replace(/^http/,'ws'));ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='error')alert(m.message);if(m.type==='admin_ok')s=m.state;if(m.type==='state')s=m.state;draw()}}function draw(){if(!s){root.innerHTML='<div class="card login"><h1 class=gold>🎤 진행자 콘솔</h1><p class=hint>관리자 키를 입력하세요.</p><input class=input id=key type=password placeholder=ADMIN_KEY><button class="btn primary" onclick="send(\'admin_login\',{key:document.querySelector(\'#key\').value})">입장</button></div>';return}let c=s.counts||[0,0,0,0];root.innerHTML='<h1>도전! 의대 골든벨 <span class=gold>진행자</span></h1><div class=card><div class=stats><div class=stat><b>'+(s.round+1)+'</b><span>ROUND</span></div><div class=stat><b>'+s.alive+'</b><span>생존자</span></div><div class=stat><b>'+s.answered+'</b><span>응답</span></div><div class=stat><b>'+s.totalParticipants+'</b><span>참가자</span></div></div>'+(s.question?'<div class=q>'+s.question+'</div>':'<h2>참가자를 기다리는 중</h2>')+'<div class=buttons>'+(s.phase==='lobby'?'<button class="btn primary" onclick="send(\'start_game\')">게임 시작</button>':'')+(s.phase==='question'?'<button class=btn onclick="send(\'simulate\')">가상 응답 채우기</button><button class="btn primary" onclick="send(\'reveal\')">🔔 결과 공개</button>':'')+(s.phase==='result'?'<button class="btn primary" onclick="send(\'next_round\')">다음 문제</button>':'')+'<button class="btn danger" onclick="send(\'reset\')">초기화</button></div>'+(s.revealed?'<div class=card><h2 class=gold>정답: '+s.result.winners.map(i=>'ABCD'[i]).join(' / ')+'</h2><p>생존자 '+s.result.survivors+'명</p><div class=bars>'+c.map((v,i)=>'<div class=row><b>'+"ABCD"[i]+'</b><div class=track><div class=fill style="width:'+(s.answered?v/s.answered*100:0)+'%"></div></div><span>'+v+'명</span></div>').join('')+'</div></div>':'')+'</div>'}connect();</script></html>
