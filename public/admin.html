<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>독심술사의 눈치고사 진행자</title><style>*{box-sizing:border-box}body{margin:0;background:#050c14;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#0b1826;border:1px solid #2e4962;border-radius:18px;padding:22px;margin-top:18px}.gold{color:#f4c95d}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#07111c;padding:15px;text-align:center;border-radius:13px}.stat b{display:block;font-size:30px;color:#fff0a6}.stat span{color:#9fb0c3;font-size:12px}.q{font-size:34px;font-weight:900;line-height:1.35;margin:15px 0}.btn{padding:14px 18px;border:1px solid #42607c;background:#122a40;color:#fff;border-radius:12px;font-weight:900;cursor:pointer}.primary{background:#e1b13e;color:#111;border:0}.danger{background:#451d29}.buttons{display:flex;gap:9px;flex-wrap:wrap}.bars{display:grid;gap:12px;margin-top:18px}.row{display:grid;grid-template-columns:30px 1fr 60px;gap:10px;align-items:center}.track{height:18px;background:#162b40;border-radius:20px;overflow:hidden}.fill{height:100%;background:#f4c95d}.input{width:100%;padding:15px;background:#07111c;border:1px solid #36516b;border-radius:12px;color:#fff;font-size:16px;margin:10px 0}.login{max-width:450px;margin:12vh auto}.hint{color:#9fb0c3}.questionimg{width:min(100%,720px);display:block;border-radius:16px;margin:14px 0;border:1px solid #2e4962}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0 18px}.choice{display:flex;align-items:flex-start;gap:12px;background:#07111c;border:1px solid #36516b;border-radius:14px;padding:15px 17px;font-size:22px;font-weight:800;line-height:1.4}.choiceLabel{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#e1b13e;color:#111;font-size:18px;font-weight:900}.rule{color:#fff0a6;font-weight:800;margin:10px 0 16px}.timer{font-size:40px;font-weight:900;color:#fff0a6;margin:8px 0 16px}.timer.danger{color:#ff9d9d}.survivorbtn{padding:12px 16px;border:1px solid #42607c;background:#10253a;color:#fff;border-radius:12px;font-weight:900;cursor:pointer}.survivorlist{display:none;margin-top:12px;padding:14px;background:#07111c;border:1px solid #2e4962;border-radius:12px;max-height:320px;overflow:auto}.survivorlist.open{display:block}.survivoritem{padding:8px 4px;border-bottom:1px solid #1d3144}.survivoritem:last-child{border-bottom:0}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.q{font-size:25px}.choices{grid-template-columns:1fr}.choice{font-size:18px}}</style><main class=wrap id=root></main><script>let ws,s=null,root=document.querySelector('#root'),survivorOpen=false;function send(type,o={}){ws&&ws.readyState===1&&ws.send(JSON.stringify({type,...o}))}function connect(){ws=new WebSocket(location.origin.replace(/^http/,'ws'));ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='error')alert(m.message);if(m.type==='admin_ok')s=m.state;if(m.type==='state'&&m.role==='admin')s=m.state;draw()}}function timeLeft(){return !s?.deadline?null:Math.max(0,Math.ceil((s.deadline-Date.now())/1000))}
function timerHTML(){let t=timeLeft();return t===null?'':'<div class="timer '+(t<=5?'danger':'')+'">⏱ '+t+'초</div>'}
function survivorListHTML(){let names=s?.survivors||[];return '<div style="margin-top:14px"><button class=survivorbtn onclick="toggleSurvivors()">'+(survivorOpen?'생존자 명단 닫기':'생존자 명단 보기')+' ('+names.length+'명)</button><div class="survivorlist '+(survivorOpen?'open':'')+'">'+names.map(n=>'<div class=survivoritem>'+escapeHtml(n)+'</div>').join('')+'</div></div>'}
function toggleSurvivors(){survivorOpen=!survivorOpen;draw()}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function draw(){if(!s){root.innerHTML='<div class="card login"><h1 class=gold>🎤 진행자 콘솔</h1><p class=hint>관리자 키를 입력하세요.</p><input class=input id=key type=password placeholder=ADMIN_KEY><button class="btn primary" onclick="send(\'admin_login\',{key:document.querySelector(\'#key\').value})">입장</button></div>';return}let c=s.counts||[],label=i=>String.fromCharCode(65+i),resultTitle=s.isExample?'예시 투표 결과':((s.isLeast?'최소 득표 생존 답변: ':'생존 답변: ')+s.result?.winners.map(i=>label(i)).join(' / '));root.innerHTML='<h1>독심술사의 눈치고사 <span class=gold>진행자</span></h1><div class=card><div class=stats><div class=stat><b>'+s.roundLabel+'</b><span>'+(s.isExample?'EXAMPLE':'ROUND')+'</span></div><div class=stat><b>'+s.alive+'</b><span>생존자</span></div><div class=stat><b>'+s.answered+'</b><span>응답</span></div><div class=stat><b>'+s.totalParticipants+'</b><span>참가자</span></div></div>'+(s.question?'<div class=hint>'+s.choiceCount+'지선다</div><div class=q>'+s.question+'</div>'+(s.image?'<img class=questionimg src="'+s.image+'" alt="선택지 사진">':'')+'<div class=choices>'+(s.choices||[]).map((ch,i)=>'<div class=choice><span class=choiceLabel>'+label(i)+'</span><span>'+escapeHtml(ch)+'</span></div>').join('')+'</div><div class=rule>'+s.ruleText+'</div>'+timerHTML():'<h2>참가자를 기다리는 중</h2>')+'<div class=buttons>'+(s.phase==='lobby'?'<button class="btn primary" onclick="send(\'start_game\')">게임 시작</button>':'')+(s.phase==='question'?'<button class=btn onclick="send(\'simulate\')">가상 응답 채우기</button><button class="btn primary" onclick="send(\'reveal\')">🔔 결과 공개</button>':'')+(s.phase==='result'?'<button class="btn primary" onclick="send(\'next_round\')">다음 문제</button>':'')+'<button class="btn danger" onclick="send(\'reset\')">초기화</button></div>'+survivorListHTML()+(s.revealed?'<div class=card><h2 class=gold>'+resultTitle+'</h2>'+(s.isExample?'<p>예시문제는 탈락 없음</p>':'<p>생존자 '+s.result.survivors+'명</p>')+'<div class=bars>'+c.map((v,i)=>'<div class=row><b>'+label(i)+'</b><div class=track><div class=fill style="width:'+(s.answered?v/s.answered*100:0)+'%"></div></div><span>'+v+'명</span></div>').join('')+'</div></div>':'')+'</div>'}connect();setInterval(()=>{if(s?.phase==='question')draw()},250);</script></html>
